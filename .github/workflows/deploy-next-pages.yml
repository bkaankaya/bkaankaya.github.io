name: Build and deploy Next.js portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-next
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm (package versions are pinned by the committed lockfile)
        uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
          run_install: false
      - name: Install without updating dependencies
        run: pnpm install --frozen-lockfile
      - name: Check verified public portfolio contact links
        run: node scripts/verify-portfolio-contacts.mjs
      - name: Build static GitHub Pages output
        run: pnpm run build
      - name: Verify the actual routes before publishing
        run: |
          test -s out/index.html
          test -s out/projects/index.html
          test -s out/experience/index.html
          test -s out/education/index.html
          test -s out/about/index.html
          touch out/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated files, not the Next.js source tree
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
