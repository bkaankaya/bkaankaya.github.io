name: One-time reviewed security lockfile refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-lockfile-refresh.yml

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Setup pinned pnpm 10.11
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.11.0'
          run_install: false
      - name: Resolve only reviewed Next.js and PostCSS security upgrades
        run: |
          pnpm add next@16.4.5 --save-exact --lockfile-only --ignore-scripts
          pnpm add -D postcss@8.5.32 --save-exact --lockfile-only --ignore-scripts
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.4.5'||p.devDependencies.postcss!=='8.5.32') process.exit(1)"
          git diff --check
      - name: Save generated manifests for review (no auto-push)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-security-manifests
          path: |
            package.json
            pnpm-lock.yaml
          retention-days: 3
