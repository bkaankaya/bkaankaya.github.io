name: One-time verified transitive advisory remediation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-security-overrides.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout for single fast-forward manifest commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.11.0'
          run_install: false
      - name: Resolve only two documented transitive advisories
        run: |
          node -e "const fs=require('fs');let p=require('./package.json');p.pnpm={...(p.pnpm||{}),overrides:{...(p.pnpm?.overrides||{}),'source-map-js':'1.2.2','baseline-browser-mapping':'2.11.0'}};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
          node scripts/verify-portfolio-contacts.mjs
          pnpm exec tsc --noEmit
          node --test scripts/*.test.mjs
          pnpm run build
          pnpm audit --audit-level high
          git diff --check
      - name: Fast-forward only reviewed manifests
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "security: resolve high-severity source-map-js and baseline browser mapping advisories"
          git push origin HEAD:main
