name: Portfolio quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source (immutable action revision)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify existing runner Node without dependency installation
        run: node --version
      - name: Validate JavaScript syntax
        run: node --check assets/main.js
      - name: Verify portfolio content, routes, design and behavior contracts
        run: node scripts/check-site.mjs
