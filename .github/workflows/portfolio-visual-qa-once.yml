name: One-time portfolio gallery visual QA

on:
  push:
    branches: [main]
    paths: [.github/workflows/portfolio-visual-qa-once.yml]

permissions:
  contents: read

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: pnpm 10.11
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.11.0'
          run_install: false
      - name: Build static site
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
          test -s out/projects/rezero.svg
          test -s out/projects/doravoice.svg
          test -s out/projects/vague.svg
          grep -q 'ReZero 2D Game' out/projects/index.html
          ! grep -q 'AI Receptionist (DoraVoice)' out/projects/index.html
      - name: Capture dark/light projects and home at phone/desktop widths
        run: |
          set -eu
          browser="$(command -v google-chrome || command -v chromium)"
          mkdir -p gallery-review
          cat > out/qa-light.html <<'EOF'
          <!doctype html><html><body><script>localStorage.setItem("bk-portfolio-theme","light");location.replace("/projects/")</script></body></html>
          EOF
          python3 -m http.server 8765 --directory out >/tmp/portfolio-site.log 2>&1 &
          sleep 2
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=3000 --screenshot=gallery-review/projects-dark-1440.png http://127.0.0.1:8765/projects/
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,900 --virtual-time-budget=3000 --screenshot=gallery-review/projects-dark-390.png http://127.0.0.1:8765/projects/
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=3000 --screenshot=gallery-review/projects-light-1440.png http://127.0.0.1:8765/qa-light.html
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,900 --virtual-time-budget=3000 --screenshot=gallery-review/projects-light-390.png http://127.0.0.1:8765/qa-light.html
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=3000 --screenshot=gallery-review/home-dark-1440.png http://127.0.0.1:8765/
          test -s gallery-review/projects-dark-1440.png
          test -s gallery-review/projects-dark-390.png
          test -s gallery-review/projects-light-1440.png
          test -s gallery-review/projects-light-390.png
          test -s gallery-review/home-dark-1440.png
      - name: Save visual evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-gallery-dark-light-responsive
          path: gallery-review/
          retention-days: 3
