name: One-time browser visual verification
# Final contrast, mobile CTA, and theme hydration review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/visual-check-once.yml

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: pnpm 10.11
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.11.0'
          run_install: false
      - name: Frozen install and static export
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Chromium dark/light desktop/mobile image inspection
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
          browser="$(command -v google-chrome || command -v chromium)"
          mkdir -p visual-artifacts
          cat > out/qa-light.html <<'EOF'
          <!doctype html><html><head><title>QA Theme</title></head><body><script>try{localStorage.setItem("bk-portfolio-theme","light")}catch(e){}location.replace("/")</script></body></html>
          EOF
          python3 -m http.server 8765 --directory out > /tmp/portfolio-web.log 2>&1 &
          sleep 2
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=2800 --screenshot=visual-artifacts/dark-desktop.png http://127.0.0.1:8765/
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,850 --virtual-time-budget=2800 --screenshot=visual-artifacts/dark-mobile.png http://127.0.0.1:8765/
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=2800 --screenshot=visual-artifacts/light-desktop.png http://127.0.0.1:8765/qa-light.html
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,850 --virtual-time-budget=2800 --screenshot=visual-artifacts/light-mobile.png http://127.0.0.1:8765/qa-light.html
          test -s visual-artifacts/dark-desktop.png
          test -s visual-artifacts/dark-mobile.png
          test -s visual-artifacts/light-desktop.png
          test -s visual-artifacts/light-mobile.png
      - name: Upload visual evidence only (never part of Pages)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: one-time-portfolio-visuals
          path: visual-artifacts/
          retention-days: 3
